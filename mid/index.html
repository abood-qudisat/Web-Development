<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>User Management</h1>
    <div class="tabs">
      <button id="addUserTab" class="active">Add User</button>
      <button id="previewUsersTab">Preview Users</button>
    </div>

    <div id="addUserSection" class="tab-content active">
      <form id="userForm">
        <label>Email: <input type="email" id="email" required /></label>
        <label>Name: <input type="text" id="name" required /></label>
        <label>Phone Number: <input type="tel" id="phone" required /></label>
        <label>
          Gender:
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>
        <label>Address: <textarea id="address" required></textarea></label>
        <button type="submit" class="add">Add User</button>
        <p id="successMessage" class="success-message"></p>
      </form>
    </div>

    <div id="previewUsersSection" class="tab-content">
      <div class="view-toggle">
        <button id="tableViewBtn" class="active">Table View</button>
        <button id="cardViewBtn">Card View</button>
      </div>
      <div id="usersDisplay"></div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
